<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Last Pixel</title>

    <!-- Load the stylesheet served by FastAPI. -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <h1>The Last Pixel</h1>

    <!-- The server sends the current remaining-square count. -->
    <p id="status">Connecting...</p>
    <p id="count">Clicks: 0</p>

    <!-- Database leaderboard: rows are created from live WebSocket data. -->
    <div id="container" aria-label="Leaderboard">
        <p>Loading leaderboard...</p>
    </div>
    <!-- Expand the leaderboard to scroll through all players, 20 rows at a time. -->
    <button id="leaderboardToggle" type="button" aria-expanded="false" aria-controls="container" hidden>Show all players ▾</button>

    <div class="username">
        <h2>What's your name?</h2>
        <form id="usernameForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <button type="submit">Save</button>
        </form>
        <p id="message"></p>
    </div>

    <!-- Show name and cooldown feedback without changing the shared board. -->
    <p id="clickNotice" role="status">Save a name to start playing.</p>

    <!-- JavaScript fills the board using the shared server state. -->
    <div class="board" id="board"></div>

    <!-- Keep the current browser session visible alongside the game. -->
    <p>Your Client ID: <span id="client_id">Connecting...</span></p>
    <h2>Active Connections:</h2>
    <ul id="connections"></ul>

    <script>
        // Restore this tab's identity and connect to the FastAPI server.
        let client_id = sessionStorage.getItem('client_id');
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(protocol + '//' + location.host + '/ws');
        socket.onopen = () => socket.send(JSON.stringify({
            type: 'identify',
            client_id: client_id,
            name: sessionStorage.getItem('client_name')
        }));

        // Keep the current tab's saved name and last successful click for visual feedback.
        let savedPlayerName = sessionStorage.getItem('client_name');
        let nextClickAllowed = 0;

        // Show when a player can click; the server still enforces all restrictions.
        function updateClickNotice() {
            const notice = document.getElementById('clickNotice');
            const remaining = Math.max(0, Math.ceil((nextClickAllowed - Date.now()) / 1000));
            notice.textContent = !savedPlayerName ? 'Save a name to start playing.' :
                remaining ? `Next click available in ${remaining}s` : 'You can click a pixel.';
        }
        // Refresh the cooldown countdown once per second.
        setInterval(updateClickNotice, 1000);
        updateClickNotice();

        // Send pixel clicks; only the server decides whether they count.
        document.getElementById('board').addEventListener('click', event => {
            const square = event.target.closest('[data-square]');
            if (square && socket.readyState === WebSocket.OPEN) {
                // Don't send clicks without a saved name or during a local cooldown.
                if (!savedPlayerName || Date.now() < nextClickAllowed) {
                    updateClickNotice();
                    return;
                }
                socket.send(JSON.stringify({type: 'click', square: Number(square.dataset.square)}));
            }
        });

        // Render the authoritative board state for every connected player.
        function renderBoard(state) {
            const board = document.getElementById('board');
            board.style.gridTemplateColumns = `repeat(${state.size}, 40px)`;
            const alive = new Set(state.alive);
            board.replaceChildren();
            for (let i = 0; i < state.size * state.size; i++) {
                const square = document.createElement(alive.has(i) ? 'button' : 'div');
                square.className = alive.has(i) ? 'square' : 'empty';
                if (alive.has(i)) {
                    square.dataset.square = i;
                    square.setAttribute('aria-label', `Remove square ${i + 1}`);
                }
                board.appendChild(square);
            }
            document.getElementById('status').textContent =
                state.won ? 'Last Pixel Clicked!' : `${state.left} left`;
            document.getElementById('count').textContent = `Clicks: ${state.clicks}`;
            // After a win, a connected browser requests a reset after two seconds.
            if (state.won && !resetPending) {
                resetPending = true;
                setTimeout(() => {
                    if (socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({type: 'reset'}));
                    }
                    resetPending = false;
                }, 2000);
            }
        }
        let resetPending = false;

        // Keep the complete leaderboard in memory so the display can be expanded or collapsed.
        let leaderboardPlayers = [];
        let leaderboardExpanded = false;

        // Show only the top 10 by default, or all players inside a 20-row scroll area.
        function renderLeaderboard(players) {
            leaderboardPlayers = [...players].sort((a, b) => b.score - a.score);
            const container = document.getElementById('container');
            const toggle = document.getElementById('leaderboardToggle');
            const scrollPosition = container.scrollTop;
            container.replaceChildren();
            container.classList.toggle('leaderboard-expanded', leaderboardExpanded);

            // Hide the expand button unless more than 10 players are recorded.
            toggle.hidden = leaderboardPlayers.length <= 10;
            toggle.textContent = leaderboardExpanded ? 'Show top 10 ▴' : 'Show all players ▾';
            toggle.setAttribute('aria-expanded', String(leaderboardExpanded));

            // Show a message when the database has no player records.
            if (!leaderboardPlayers.length) {
                container.textContent = 'No players yet.';
                return;
            }

            // Display the top 10, or every player when expanded.
            const visiblePlayers = leaderboardExpanded ? leaderboardPlayers : leaderboardPlayers.slice(0, 10);
            visiblePlayers.forEach(player => {
                // Build rows safely without interpreting player names as HTML.
                const row = document.createElement('div');
                row.className = 'row';
                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = player.name || 'Unnamed Player';
                const score = document.createElement('div');
                score.className = 'score';
                score.textContent = player.score;
                row.append(name, score);
                container.appendChild(row);
            });

            // Preserve the scroll position during live score updates when expanded.
            if (leaderboardExpanded) container.scrollTop = scrollPosition;
        }

        // Toggle between the top 10 and the full scrollable leaderboard.
        document.getElementById('leaderboardToggle').addEventListener('click', () => {
            leaderboardExpanded = !leaderboardExpanded;
            renderLeaderboard(leaderboardPlayers);
            document.getElementById('container').scrollTop = 0;
        });

        // Handle identity, player list, and board updates from FastAPI.
        socket.onmessage = event => {
            const message = JSON.parse(event.data);
            if (message.type === 'welcome') {
                client_id = message.client_id;
                sessionStorage.setItem('client_id', client_id);
                document.getElementById('client_id').textContent = client_id;
            } else if (message.type === 'connections_updated') {
                const list = document.getElementById('connections');
                list.replaceChildren();
                message.clients.forEach(client => {
                    const item = document.createElement('li');
                    item.textContent = `${client.client_id} | Name: ${client.name ?? 'None'}`;
                    list.appendChild(item);
                });
            // A successful click starts the visible five-second cooldown.
            } else if (message.type === 'click_accepted') {
                nextClickAllowed = Date.now() + message.cooldown * 1000;
                updateClickNotice();
            // Server rejection is authoritative if another request was too soon.
            } else if (message.type === 'click_rejected') {
                if (message.remaining) nextClickAllowed = Date.now() + message.remaining * 1000;
                document.getElementById('clickNotice').textContent = message.reason;
            } else if (message.type === 'board_updated') {
                renderBoard(message);
            // Refresh the leaderboard when scores or the weekly reset change.
            } else if (message.type === 'leaderboard_updated') {
                renderLeaderboard(message.players);
            }
        };
        socket.onclose = () => {
            document.getElementById('client_id').textContent = 'Disconnected';
        };


        document.addEventListener('DOMContentLoaded', () => {
        // Check if a username is already saved and display it
        const savedUsername = sessionStorage.getItem('client_name');
        const message = document.getElementById('message');

        if (savedUsername) {
            message.textContent = `Welcome back, ${savedUsername}!`;
        }

        // Restore the name to the existing form on reload.
        if (savedUsername) {
            document.getElementById('username').value = savedUsername;
        }
        // Form submission handler
        const form = document.getElementById('usernameForm');
        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent form from refreshing the page

            // Get the entered username
            const usernameInput = document.getElementById('username').value.trim();
            if (!usernameInput || socket.readyState !== WebSocket.OPEN) return;

            // Send the name to FastAPI and save it for page refreshes.
            sessionStorage.setItem('client_name', usernameInput);
            // Enable clicking after a valid name has been saved.
            savedPlayerName = usernameInput;
            updateClickNotice();
            socket.send(JSON.stringify({type: 'set_name', name: usernameInput}));

            // Display a message
            message.textContent = `Username saved: ${usernameInput}`;
        });
        });
    </script>

</body>
</html>
