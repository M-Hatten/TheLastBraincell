<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Last Pixel</title>

    <!-- Connect the external CSS file -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>The Last Pixel</h1>

    <!-- Display the number of remaining squares -->
    <p id="status">
        {% if remaining == 0 %}
            Last Pixel Clicked!
        {% else %}
            {{ remaining }} left
        {% endif %}
    </p>

    <!-- Create the game board -->
    <div class="board">
        {% for sq in range(size * size) %}

            {% if sq in alive %}
                <!-- A square that can be clicked -->
                <form method="post">
                    <button
                        class="square"
                        type="submit"
                        name="square"
                        value="{{ sq }}"
                        aria-label="Remove square {{ sq + 1 }}">
                    </button>
                </form>
            {% else %}
                <!-- Preserve the empty space -->
                <div class="empty"></div>
            {% endif %}

        {% endfor %}
    </div>

</body>
</html>
